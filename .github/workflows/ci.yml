name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-powershell:
    name: Validate PowerShell Scripts
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: PowerShell AST Parse Check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts/*.ps1 -Recurse | ForEach-Object {
              Write-Host "Testing syntax for: $($_.Name)" -ForegroundColor Cyan
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
              if ($parseErrors -and $parseErrors.Count -gt 0) {
                  Write-Error "Syntax error in $($_.Name):"
                  $parseErrors | ForEach-Object { Write-Error "  Line $($_.Extent.StartLineNumber): $($_.Message)" }
                  $failed = $true
              } else {
                  Write-Host "  -> OK" -ForegroundColor Green
              }
          }
          if ($failed) {
              throw "PowerShell AST parse check failed."
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($results.Count -gt 0) {
              $results | Format-Table -AutoSize
              throw "PSScriptAnalyzer detected $($results.Count) error-level violations."
          }
          Write-Host "PSScriptAnalyzer passed with 0 errors." -ForegroundColor Green
